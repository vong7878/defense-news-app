<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ມຸມເກມ 15 ດ່ານ - Game Zone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm space-y-4">
        <!-- ປຸ່ມສະຫຼັບ 3 ເກມ (Tabs) -->
        <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-[11px] font-bold text-slate-400">
            <button id="tab-snake" onclick="switchGame('snake')" class="flex-1 py-2 rounded-lg bg-amber-500 text-slate-950 transition-all flex items-center justify-center gap-1">
                🐍 ງູກິນຂຽດ
            </button>
            <button id="tab-match" onclick="switchGame('match')" class="flex-1 py-2 rounded-lg transition-all flex items-center justify-center gap-1 hover:text-white">
                🍓 ຈັບຄູ່
            </button>
            <button id="tab-mole" onclick="switchGame('mole')" class="flex-1 py-2 rounded-lg transition-all flex items-center justify-center gap-1 hover:text-white">
                🐹 ຕີຕຸ່ນ
            </button>
        </div>

        <!-- 🐍 SECTION 1: ເກມງູກິນຂຽດ (15 ດ່ານ) -->
        <div id="section-snake" class="game-container">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                <h2 class="text-sm font-bold text-amber-400 flex items-center gap-2">
                    <span>🐍</span> ງູກິນຂຽດ <span id="snake-level-badge" class="text-xs bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full">ດ່ານ 1/15</span>
                </h2>
                <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg transition-all">🏠 ໜ້າຫຼັກ</a>
            </div>
            <div class="flex justify-between text-xs text-slate-400 mb-3 px-1">
                <span>🎯 ເປົ້າໝາຍ: <span id="snake-target" class="text-amber-400 font-bold">0/3</span> ໂຕ</span>
                <span>⚡ ຄວາມໄວ: <span id="snake-speed" class="text-emerald-400 font-bold">ງ່າຍ</span></span>
            </div>
            <canvas id="snakeCanvas" width="300" height="300"></canvas>
            <div class="mt-4 grid grid-cols-3 gap-2 max-w-[200px] mx-auto">
                <div></div>
                <button id="btn-up" class="snake-btn">⬆️</button>
                <div></div>
                <button id="btn-left" class="snake-btn">⬅️</button>
                <button id="btn-down" class="snake-btn">⬇️</button>
                <button id="btn-right" class="snake-btn">➡️</button>
            </div>
            <button id="snake-start-btn" class="w-full mt-4 py-2 bg-amber-500 hover:bg-amber-600 active:scale-95 text-slate-950 font-bold rounded-xl transition-all shadow-lg text-xs">
                🎮 ເລີ່ມດ່ານນີ້
            </button>
        </div>

        <!-- 🍓 SECTION 2: ເກມຈັບຄູ່ໝາກໄມ້ (15 ດ່ານ) -->
        <div id="section-match" class="game-container hidden">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                <h2 class="text-sm font-bold text-amber-400 flex items-center gap-2">
                    <span>🍓</span> ຈັບຄູ່ໝາກໄມ້ <span id="match-level-badge" class="text-xs bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full">ດ່ານ 1/15</span>
                </h2>
                <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg transition-all">🏠 ໜ້າຫຼັກ</a>
            </div>
            <div class="flex justify-between text-xs text-slate-400 mb-3 px-1">
                <span>🔄 ໂຄຕ້າກົດ: <span id="match-moves-left" class="text-white font-bold">ບໍ່ຈຳກັດ</span></span>
                <span>🏆 ຄູ່ທີ່ເຫຼືອ: <span id="match-pairs" class="text-emerald-400 font-bold">0</span></span>
            </div>
            <div id="match-board" class="grid gap-2 mb-4"></div>
            <button id="match-reset-btn" class="w-full py-2 bg-amber-500 hover:bg-amber-600 active:scale-95 text-slate-950 font-bold rounded-xl transition-all shadow-lg text-xs">
                🔄 ເລີ່ມດ່ານນີ້ໃໝ່
            </button>
        </div>

        <!-- 🐹 SECTION 3: ເກມຕີຕຸ່ນ (15 ດ່ານ - ໃໝ່!) -->
        <div id="section-mole" class="game-container hidden">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                <h2 class="text-sm font-bold text-amber-400 flex items-center gap-2">
                    <span>🐹</span> ຕີຕຸ່ນ <span id="mole-level-badge" class="text-xs bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full">ດ່ານ 1/15</span>
                </h2>
                <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg transition-all">🏠 ໜ້າຫຼັກ</a>
            </div>
            <div class="flex justify-between text-xs text-slate-400 mb-3 px-1">
                <span>🎯 ຄະແນນ: <span id="mole-score" class="text-amber-400 font-bold">0/5</span></span>
                <span>⏱️ ເວລາ: <span id="mole-time" class="text-emerald-400 font-bold">20s</span></span>
            </div>

            <!-- ກະດານຂຸມຕຸ່ນ 3x3 -->
            <div id="mole-board" class="grid grid-cols-3 gap-3 my-4">
                <div class="mole-hole" data-index="0"></div>
                <div class="mole-hole" data-index="1"></div>
                <div class="mole-hole" data-index="2"></div>
                <div class="mole-hole" data-index="3"></div>
                <div class="mole-hole" data-index="4"></div>
                <div class="mole-hole" data-index="5"></div>
                <div class="mole-hole" data-index="6"></div>
                <div class="mole-hole" data-index="7"></div>
                <div class="mole-hole" data-index="8"></div>
            </div>

            <button id="mole-start-btn" class="w-full py-2 bg-amber-500 hover:bg-amber-600 active:scale-95 text-slate-950 font-bold rounded-xl transition-all shadow-lg text-xs">
                🎮 ເລີ່ມດ່ານນີ້
            </button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
